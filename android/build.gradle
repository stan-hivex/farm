allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Fix Firebase Messaging and Play Services resource conflicts
subprojects { project ->
    afterEvaluate {
        if (project.name == 'firebase_messaging') {
            project.tasks.each { task ->
                if (task.name.contains('verifyReleaseResources')) {
                    task.enabled = false
                }
            }
        }
    }
}

project.allprojects {
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-base:18.2.0'
            force 'androidx.core:core:1.13.1'
            force 'com.google.android.material:material:1.11.0'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 36
            }
        }
        if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
